<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#000"/></marker></defs>
  <rect width="1800" height="2500" fill="#fff"/>
  <g font-family="Times New Roman, serif" fill="#000" stroke="#000" stroke-width="2">
    <text x="900" y="40" text-anchor="middle" font-size="28" font-weight="bold" stroke="none">LEVEL 2 — DETAILED MODULE DATA FLOWS</text>
    <text x="900" y="72" text-anchor="middle" font-size="18" stroke="none">Black-and-white module-level DFDs</text>

    <text x="900" y="125" text-anchor="middle" font-size="23" font-weight="bold" stroke="none">A. AUTHENTICATION AND USER MANAGEMENT</text>
    <rect x="80" y="170" width="180" height="70" fill="#fff"/><text x="170" y="212" text-anchor="middle" font-size="19" font-weight="bold" stroke="none">FARMER / ADMIN</text>
    <rect x="360" y="150" width="220" height="80" fill="#fff"/><text x="470" y="198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">1.1 REGISTER</text>
    <rect x="680" y="150" width="220" height="80" fill="#fff"/><text x="790" y="198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">1.2 VALIDATE</text>
    <rect x="1000" y="150" width="220" height="80" fill="#fff"/><text x="1110" y="198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">1.3 CREATE SESSION</text>
    <rect x="1320" y="150" width="260" height="80" fill="#fff"/><text x="1450" y="198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">D1 USER / ADMIN ACCOUNTS</text>
    <path d="M260 205 H360" fill="none" marker-end="url(#a)"/><path d="M580 190 H680" fill="none" marker-end="url(#a)"/><path d="M900 190 H1000" fill="none" marker-end="url(#a)"/><path d="M1220 190 H1320" fill="none" marker-end="url(#a)"/><path d="M1320 215 H1110 V230" fill="none" marker-end="url(#a)"/>
    <text x="900" y="265" text-anchor="middle" font-size="16" stroke="none">Registration, credentials, account records, and authenticated sessions</text>

    <text x="900" y="365" text-anchor="middle" font-size="23" font-weight="bold" stroke="none">B. SCAN AND COMPUTER-VISION PROCESSING</text>
    <rect x="70" y="420" width="180" height="70" fill="#fff"/><text x="160" y="462" text-anchor="middle" font-size="19" font-weight="bold" stroke="none">FARMER</text>
    <rect x="320" y="400" width="220" height="80" fill="#fff"/><text x="430" y="448" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">2.1 CAPTURE IMAGE</text>
    <rect x="610" y="400" width="220" height="80" fill="#fff"/><text x="720" y="448" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">2.2 VALIDATE IMAGE</text>
    <rect x="900" y="400" width="220" height="80" fill="#fff"/><text x="1010" y="448" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">2.3 REQUEST PREDICTION</text>
    <rect x="1190" y="400" width="220" height="80" fill="#fff"/><text x="1300" y="448" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">2.4 RECEIVE RESULT</text>
    <rect x="1480" y="400" width="230" height="80" fill="#fff"/><text x="1595" y="448" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">D2 SCAN RECORDS</text>
    <path d="M250 455 H320" fill="none" marker-end="url(#a)"/><path d="M540 440 H610" fill="none" marker-end="url(#a)"/><path d="M830 440 H900" fill="none" marker-end="url(#a)"/><path d="M1120 440 H1190" fill="none" marker-end="url(#a)"/><path d="M1410 440 H1480" fill="none" marker-end="url(#a)"/>
    <text x="900" y="515" text-anchor="middle" font-size="16" stroke="none">Crop image, validation result, prediction request, variety, maturity, and confidence score</text>

    <text x="900" y="615" text-anchor="middle" font-size="23" font-weight="bold" stroke="none">C. AGRONOMIC ESTIMATION AND RECOMMENDATIONS</text>
    <rect x="70" y="670" width="180" height="70" fill="#fff"/><text x="160" y="712" text-anchor="middle" font-size="19" font-weight="bold" stroke="none">FARMER</text>
    <rect x="320" y="650" width="230" height="80" fill="#fff"/><text x="435" y="698" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">3.1 COLLECT INPUTS</text>
    <rect x="630" y="650" width="230" height="80" fill="#fff"/><text x="745" y="698" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">3.2 VALIDATE INPUTS</text>
    <rect x="940" y="650" width="230" height="80" fill="#fff"/><text x="1055" y="698" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">3.3 CALCULATE YIELD</text>
    <rect x="1250" y="650" width="230" height="80" fill="#fff"/><text x="1365" y="698" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">3.4 RECOMMENDATIONS</text>
    <rect x="1540" y="650" width="190" height="80" fill="#fff"/><text x="1635" y="698" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">D3 AGRONOMIC LOGS</text>
    <path d="M250 705 H320" fill="none" marker-end="url(#a)"/><path d="M550 690 H630" fill="none" marker-end="url(#a)"/><path d="M860 690 H940" fill="none" marker-end="url(#a)"/><path d="M1170 690 H1250" fill="none" marker-end="url(#a)"/><path d="M1480 690 H1540" fill="none" marker-end="url(#a)"/>
    <text x="900" y="765" text-anchor="middle" font-size="16" stroke="none">Hectares, crop stage, farm practices, yield estimates, and recommendation records</text>

    <text x="900" y="865" text-anchor="middle" font-size="23" font-weight="bold" stroke="none">D. ADMINISTRATION, REPORTING AND COMMUNICATION</text>
    <rect x="70" y="920" width="190" height="70" fill="#fff"/><text x="165" y="962" text-anchor="middle" font-size="18" font-weight="bold" stroke="none">SYSTEM ADMIN</text>
    <rect x="330" y="900" width="230" height="80" fill="#fff"/><text x="445" y="948" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">5.1 MANAGE USERS</text>
    <rect x="640" y="900" width="230" height="80" fill="#fff"/><text x="755" y="948" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">5.2 MONITOR SCANS</text>
    <rect x="950" y="900" width="230" height="80" fill="#fff"/><text x="1065" y="948" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">5.3 GENERATE REPORTS</text>
    <rect x="1260" y="900" width="230" height="80" fill="#fff"/><text x="1375" y="948" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">5.4 PUBLISH NEWS</text>
    <rect x="1570" y="900" width="180" height="80" fill="#fff"/><text x="1660" y="948" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">D4 FEEDBACK</text>
    <path d="M260 955 H330" fill="none" marker-end="url(#a)"/><path d="M560 940 H640" fill="none" marker-end="url(#a)"/><path d="M870 940 H950" fill="none" marker-end="url(#a)"/><path d="M1180 940 H1260" fill="none" marker-end="url(#a)"/><path d="M1490 940 H1570" fill="none" marker-end="url(#a)"/>
    <text x="900" y="1015" text-anchor="middle" font-size="16" stroke="none">Account actions, monitoring logs, reports, announcements, and farmer feedback</text>

    <text x="900" y="1115" text-anchor="middle" font-size="23" font-weight="bold" stroke="none">E. OFFLINE STORAGE AND SYNCHRONIZATION</text>
    <rect x="70" y="1170" width="180" height="70" fill="#fff"/><text x="160" y="1212" text-anchor="middle" font-size="19" font-weight="bold" stroke="none">FARMER</text>
    <rect x="320" y="1150" width="240" height="80" fill="#fff"/><text x="440" y="1198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">6.1 SAVE OFFLINE DRAFT</text>
    <rect x="650" y="1150" width="250" height="80" fill="#fff"/><text x="775" y="1198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">D5 LOCAL OFFLINE QUEUE</text>
    <rect x="990" y="1150" width="250" height="80" fill="#fff"/><text x="1115" y="1198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">6.2 UPLOAD PENDING DATA</text>
    <rect x="1330" y="1150" width="250" height="80" fill="#fff"/><text x="1455" y="1198" text-anchor="middle" font-size="17" font-weight="bold" stroke="none">6.3 CONFIRM SYNC STATUS</text>
    <path d="M250 1205 H320" fill="none" marker-end="url(#a)"/><path d="M560 1190 H650" fill="none" marker-end="url(#a)"/><path d="M900 1190 H990" fill="none" marker-end="url(#a)"/><path d="M1240 1190 H1330" fill="none" marker-end="url(#a)"/><path d="M1455 1230 V1280 H160 V1240" fill="none" marker-end="url(#a)"/>
    <text x="900" y="1300" text-anchor="middle" font-size="16" stroke="none">Offline draft, queued record, upload request, and Synced / Failed / Conflict status</text>

    <text x="900" y="1430" text-anchor="middle" font-size="18" stroke="none">All process and data-store boxes are rectangular to match the required DFD style.</text>
  </g>
</svg>
