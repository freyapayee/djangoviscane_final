<!DOCTYPE html>
<html lang="{{ 'hil' if is_hiligaynon() else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>VISCANE | Superadmin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-login-premium.css') }}?v=2">
</head>
<body class="vis-auth-simple ds-app vis-admin-login-page vis-superadmin-login-page">
    <main class="card fade-in" aria-labelledby="superadmin-login-title">

        <div class="admin-login-header">
            <div class="admin-login-icon-circle">
                <svg viewBox="0 0 24 24" class="console-icon" aria-hidden="true"><use href="{{ url_for('static', filename='images/access-icons.svg') }}#shield-checkmark-outline"></use></svg>
            </div>
            <h1 id="superadmin-login-title" class="admin-login-title">Superadmin Access</h1>
            <p class="admin-login-subtitle">Restricted system governance</p>
        </div>

        {% if error %}
            <div class="form-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="form-success">{{ success }}</div>
        {% endif %}

        <form class="fade-in" method="POST" action="/superadmin-login">
            {{ csrf_input }}
            <label class="ds-field-label" for="ds-superadmin_login-identifier">Username or Email</label>
<div class="input-wrapper">
                <svg viewBox="0 0 24 24" class="console-icon console-field-icon" aria-hidden="true"><use href="{{ url_for('static', filename='images/access-icons.svg') }}#person-outline"></use></svg>
                <input id="ds-superadmin_login-identifier" type="text" name="identifier" placeholder="Enter your username or email" autocomplete="username" required>
            </div>
            <label class="ds-field-label" for="ds-superadmin_login-password">Password</label>
<div class="input-wrapper">
                <svg viewBox="0 0 24 24" class="console-icon console-field-icon" aria-hidden="true"><use href="{{ url_for('static', filename='images/access-icons.svg') }}#lock-outline"></use></svg>
                <input id="ds-superadmin_login-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="vis-password-toggle" data-password-toggle="ds-superadmin_login-password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" class="console-icon" aria-hidden="true"><use href="{{ url_for('static', filename='images/access-icons.svg') }}#eye-outline"></use><path class="console-eye-slash" d="m3 3 18 18"/></svg></button></div>

            <button type="submit" class="primary-btn">
                Sign In as Superadmin <span aria-hidden="true">&rarr;</span>
            </button>
        </form>

        <div class="console-support-links is-single">
            <a href="/superadmin-register" class="admin-login-link"><svg viewBox="0 0 24 24" class="console-icon" aria-hidden="true"><use href="{{ url_for('static', filename='images/access-icons.svg') }}#person-outline"></use></svg>Superadmin registration</a>
        </div>

        <div class="admin-login-footer">
            <a href="/admin-access" class="admin-login-back-link">&larr; Back to Admin Access</a>
        </div>
    </main>
    {% include 'hiligaynon_runtime.html' %}
    <script src="{{ url_for('static', filename='viscane-ui.js') }}" defer></script>
</body>
</html>
