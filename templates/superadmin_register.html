<!DOCTYPE html>
<html lang="{{ 'hil' if is_hiligaynon() else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>VISCANE | Superadmin Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
</head>
<body class="vis-auth-simple ds-app">
    {% include 'components/app_header.html' %}
    <div class="card fade-in">

        <div class="admin-login-header">
            <div class="admin-login-icon-circle">
                <ion-icon name="person-add-outline" style="font-size: 30px;"></ion-icon>
            </div>
            <h2 style="margin: 15px 0 5px;">Superadmin Registration</h2>
            <p class="admin-login-subtitle">Create a superadmin account</p>
        </div>

        {% if error %}
            <div class="form-error">{{ error }}</div>
        {% endif %}

        <form class="fade-in" method="POST" action="/superadmin-register">
            {{ csrf_input }}
            <label class="ds-field-label" for="ds-superadmin_register-username">Username</label>
<div class="input-wrapper">
                <ion-icon name="person-outline"></ion-icon>
                <input id="ds-superadmin_register-username" type="text" name="username" placeholder="Username" required>
            </div>
            <label class="ds-field-label" for="ds-superadmin_register-email">Email</label>
<div class="input-wrapper">
                <ion-icon name="mail-outline"></ion-icon>
                <input id="ds-superadmin_register-email" type="email" name="email" placeholder="Email" required>
            </div>
            <label class="ds-field-label" for="ds-superadmin_register-password">Password (min 8 chars)</label>
<div class="input-wrapper">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input id="ds-superadmin_register-password" type="password" name="password" placeholder="Password (min 8 chars)" required>
            <button type="button" class="vis-password-toggle" data-password-toggle="ds-superadmin_register-password" aria-label="Show password" aria-pressed="false"><span>Show</span></button></div>
            <label class="ds-field-label" for="ds-superadmin_register-confirm_password">Confirm Password</label>
<div class="input-wrapper">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input id="ds-superadmin_register-confirm_password" type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="button" class="vis-password-toggle" data-password-toggle="ds-superadmin_register-confirm_password" aria-label="Show password" aria-pressed="false"><span>Show</span></button></div>

            <button type="submit" class="primary-btn">
                Create Superadmin
            </button>
        </form>

        <div class="admin-login-footer">
            <a href="/superadmin-login" class="admin-login-back-link">&larr; Back to Superadmin Login</a>
        </div>
    </div>
    {% include 'hiligaynon_runtime.html' %}
    <script src="{{ url_for('static', filename='viscane-ui.js') }}" defer></script>
</body>
</html>
