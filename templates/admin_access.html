<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>VISCANE | Admin Access</title>
</head>
<body>
    <div class="card fade-in">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="background: #1E88E5; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.2);">
                <ion-icon name="shield-checkmark-outline"></ion-icon>
            </div>
            <h2 style="margin: 20px 0 5px;">Admin Access</h2>
            <p style="color: rgba(255,255,255,0.6); font-size: 14px;">Choose your role to continue to the correct login</p>
        </div>

        <div class="portal-item" onclick="location.href='/admin-login'">
            <div class="icon-circle" style="background: #1976D2;">
                <ion-icon name="person-circle-outline" style="font-size: 28px;"></ion-icon>
            </div>
            <h3 style="margin: 0; font-size: 18px;">Admin</h3>
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 5px;">Go to standard admin login</p>
        </div>

        <div class="portal-item" onclick="location.href='/superadmin-login'">
            <div class="icon-circle" style="background: #0D47A1;">
                <ion-icon name="shield-half-outline" style="font-size: 28px;"></ion-icon>
            </div>
            <h3 style="margin: 0; font-size: 18px;">Superadmin</h3>
            <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 5px;">Go to restricted superadmin login</p>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" class="admin-login-back-link">&larr; Back to Selection</a>
        </div>
    </div>
</body>
</html>
