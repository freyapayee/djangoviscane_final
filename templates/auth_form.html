<form class="fade-in auth-form auth-form--{{ mode }}" method="POST" action="/auth?mode={{ mode }}" data-loading-form>
    {{ csrf_input }}
    {% if mode == 'login' %}
        <div class="vis-field">
            <label class="vis-field-label" for="login-email">{{ farmer_text('Email Address') }}</label>
            <div class="input-wrapper"><ion-icon name="mail-outline"></ion-icon><input id="login-email" type="email" name="email" placeholder="farmer@example.com" autocomplete="email" required></div>
        </div>
        <div class="vis-field">
            <label class="vis-field-label" for="login-password">{{ farmer_text('Password') }}</label>
            <div class="input-wrapper"><ion-icon name="lock-closed-outline"></ion-icon><input id="login-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required><button class="vis-password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password"><ion-icon name="eye-outline"></ion-icon><span>Show</span></button></div>
        </div>
    {% else %}
        <div class="vis-field"><label class="vis-field-label" for="register-name">{{ farmer_text('Full Name') }}</label><div class="input-wrapper"><ion-icon name="person-outline"></ion-icon><input id="register-name" type="text" name="fullname" placeholder="Juan Dela Cruz" autocomplete="name" required></div></div>
        <div class="vis-field"><label class="vis-field-label" for="register-email">{{ farmer_text('Email Address') }}</label><div class="input-wrapper"><ion-icon name="mail-outline"></ion-icon><input id="register-email" type="email" name="email" placeholder="farmer@example.com" autocomplete="email" required></div></div>
        <div class="vis-field"><label class="vis-field-label" for="register-phone">{{ farmer_text('Phone Number') }}</label><div class="input-wrapper has-warning"><ion-icon name="call-outline"></ion-icon><input id="register-phone" type="tel" name="phone" placeholder="09XXXXXXXXX" autocomplete="tel" inputmode="numeric" minlength="11" maxlength="11" pattern="[0-9]{11}" title="{{ farmer_text('Phone number must be exactly 11 digits.') }}" required><span class="input-warning">{{ farmer_text('Phone number must be exactly 11 digits.') }}</span></div></div>
        <div class="vis-field"><label class="vis-field-label" for="register-province">{{ farmer_text('Province') }}</label><div class="input-wrapper"><ion-icon name="map-outline"></ion-icon><select id="register-province" name="province" required><option value="" disabled selected>{{ farmer_text('Select Province') }}</option><option value="Negros Occidental">Negros Occidental</option></select></div></div>
        <div class="vis-field"><label class="vis-field-label" for="register-municipality">{{ farmer_text('Municipality') }}</label><div class="input-wrapper"><ion-icon name="business-outline"></ion-icon><select id="register-municipality" name="municipality" required><option value="" disabled selected>{{ farmer_text('Select Municipality') }}</option><option value="Isabela">Isabela</option></select></div></div>
        <div class="vis-field"><label class="vis-field-label" for="register-barangay">{{ farmer_text('Barangay') }}</label><div class="input-wrapper"><ion-icon name="home-outline"></ion-icon><select id="register-barangay" name="barangay" required>
            <option value="" disabled selected>{{ farmer_text('Select Barangay') }}</option>
            {% for barangay in ['Amin','Banogbanog','Bulad','Bungahin','Cabcab','Camangcamang','Camp Clark','Cansalongon','Guintubhan','Libas','Limalima','Makilignit','Mansablay','Maytubig','Panaquiao','Barangay 1 (Poblacion)','Barangay 2 (Poblacion)','Barangay 3 (Poblacion)','Barangay 4 (Poblacion)','Barangay 5 (Poblacion)','Barangay 6 (Poblacion)','Barangay 7 (Poblacion)','Barangay 8 (Poblacion)','Barangay 9 (Poblacion)','Riverside','Rumirang','San Agustin','Sebucawan','Sikatuna','Tinongan'] %}<option value="{{ barangay }}">{{ barangay }}</option>{% endfor %}
        </select></div></div>
        <div class="vis-field"><label class="vis-field-label" for="register-password">{{ farmer_text('Password') }}</label><div class="input-wrapper"><ion-icon name="lock-closed-outline"></ion-icon><input id="register-password" type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required><button class="vis-password-toggle" type="button" data-password-toggle="register-password" aria-label="Show password"><ion-icon name="eye-outline"></ion-icon><span>Show</span></button></div><p class="vis-form-help">Use at least 8 characters for a stronger account.</p></div>
        <div class="vis-field"><label class="vis-field-label" for="register-confirm-password">{{ farmer_text('Confirm Password') }}</label><div class="input-wrapper"><ion-icon name="lock-closed-outline"></ion-icon><input id="register-confirm-password" type="password" name="confirm_password" placeholder="Repeat your password" autocomplete="new-password" minlength="8" required><button class="vis-password-toggle" type="button" data-password-toggle="register-confirm-password" aria-label="Show password"><ion-icon name="eye-outline"></ion-icon><span>Show</span></button></div></div>
    {% endif %}
    <button type="submit" class="primary-btn"><span class="vis-button-spinner" aria-hidden="true"></span><span>{{ farmer_text('Sign In' if mode == 'login' else 'Create Account') }}</span></button>
</form>
