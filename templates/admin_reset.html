<!DOCTYPE html>
<html lang="{{ 'hil' if is_hiligaynon() else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>VISCANE | Admin Reset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
</head>
<body class="vis-auth-simple ds-app">
    {% include 'components/app_header.html' %}
    <div class="card fade-in">

        <div class="admin-login-header">
            <div class="admin-login-icon-circle">
                <ion-icon name="key-outline" style="font-size: 30px;"></ion-icon>
            </div>
            <h2 style="margin: 15px 0 5px;">Reset Admin Password</h2>
            <p class="admin-login-subtitle">Superadmin-authorized password reset</p>
        </div>

        {% if error %}
            <div class="form-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="form-success">{{ success }}</div>
        {% endif %}

        <form class="fade-in" method="POST" action="/admin-reset">
            {{ csrf_input }}
            <label class="ds-field-label" for="ds-admin_reset-identifier">Username or Email</label>
<div class="input-wrapper">
                <ion-icon name="person-outline"></ion-icon>
                <input id="ds-admin_reset-identifier" type="text" name="identifier" placeholder="Username or Email" required>
            </div>
            <label class="ds-field-label" for="ds-admin_reset-email">Registered Email</label>
<div class="input-wrapper">
                <ion-icon name="mail-outline"></ion-icon>
                <input id="ds-admin_reset-email" type="email" name="email" placeholder="Registered Email" required>
            </div>
            <label class="ds-field-label" for="ds-admin_reset-password">New Password</label>
<div class="input-wrapper">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input id="ds-admin_reset-password" type="password" name="password" placeholder="New Password" required>
            <button type="button" class="vis-password-toggle" data-password-toggle="ds-admin_reset-password" aria-label="Show password" aria-pressed="false"><span>Show</span></button></div>
            <label class="ds-field-label" for="ds-admin_reset-confirm_password">Confirm New Password</label>
<div class="input-wrapper">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input id="ds-admin_reset-confirm_password" type="password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="button" class="vis-password-toggle" data-password-toggle="ds-admin_reset-confirm_password" aria-label="Show password" aria-pressed="false"><span>Show</span></button></div>

            <button type="submit" class="primary-btn">
                Update Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/admin-login" class="admin-login-back-link">&larr; Back to Admin Login</a>
        </div>
    </div>
    {% include 'hiligaynon_runtime.html' %}
    <script src="{{ url_for('static', filename='viscane-ui.js') }}" defer></script>
</body>
</html>
