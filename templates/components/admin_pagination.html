<nav class="admin-pagination" aria-label="Pagination">
    {% if page_obj.has_previous() %}<a class="admin-page-control" href="?page={{ page_obj.previous_page_number() }}{% if query_string %}&{{ query_string }}{% endif %}"><ion-icon name="chevron-back-outline"></ion-icon>Previous</a>{% else %}<span class="admin-page-control is-disabled"><ion-icon name="chevron-back-outline"></ion-icon>Previous</span>{% endif %}
    <div class="admin-page-numbers">{% for page_number in page_numbers %}{% if page_number %}<a href="?page={{ page_number }}{% if query_string %}&{{ query_string }}{% endif %}" class="admin-page-number{% if page_number == page_obj.number %} is-current{% endif %}"{% if page_number == page_obj.number %} aria-current="page"{% endif %}>{{ page_number }}</a>{% else %}<span class="admin-page-ellipsis">…</span>{% endif %}{% endfor %}</div>
    {% if page_obj.has_next() %}<a class="admin-page-control" href="?page={{ page_obj.next_page_number() }}{% if query_string %}&{{ query_string }}{% endif %}">Next<ion-icon name="chevron-forward-outline"></ion-icon></a>{% else %}<span class="admin-page-control is-disabled">Next<ion-icon name="chevron-forward-outline"></ion-icon></span>{% endif %}
</nav>
